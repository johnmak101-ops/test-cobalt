<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="900" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="55" fill="url(#headerGrad)"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">Cobalt ShipTrack: Email Communication Flow</text>
  <text x="970" y="36" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#aaa">Verified from 146 sample emails</text>
  
  <!-- Layman summary box -->
  <rect x="30" y="70" width="940" height="75" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="500" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">What is this?</text>
  <text x="500" y="112" font-family="Arial, sans-serif" font-size="11" fill="#1e1b4b" text-anchor="middle">Cobalt manufactures knitwear in China for fashion brands worldwide (UK, US, EU). They hire freight forwarders to ship goods.</text>
  <text x="500" y="130" font-family="Arial, sans-serif" font-size="11" fill="#1e1b4b" text-anchor="middle">Physical flow: Factory &#8594; CFS Warehouse (consolidation) &#8594; Port &#8594; Vessel &#8594; Destination Port &#8594; Brand Warehouse</text>
  
  <!-- Parties - Cobalt -->
  <circle cx="120" cy="195" r="32" fill="#e0e7ff" stroke="#4338ca" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="202" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3730a3" text-anchor="middle">C</text>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Cobalt</text>
  <text x="120" y="260" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">(Manufacturer)</text>
  
  <!-- Parties - Forwarder -->
  <circle cx="880" cy="195" r="32" fill="#fce7f3" stroke="#db2777" stroke-width="3" filter="url(#shadow)"/>
  <text x="880" y="202" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#9d174d" text-anchor="middle">F</text>
  <text x="880" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Forwarder</text>
  <text x="880" y="260" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">(GFS, JAS, Logwin...)</text>
  
  <!-- Flow direction labels -->
  <rect x="220" y="275" width="130" height="26" rx="13" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="285" y="293" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3730a3" text-anchor="middle">OUTBOUND &#8594;</text>
  
  <rect x="650" y="275" width="130" height="26" rx="13" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="715" y="293" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9d174d" text-anchor="middle">&#8592; INBOUND</text>
  
  <!-- Timeline line -->
  <line x1="500" y1="320" x2="500" y2="780" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- ==================== STEP 1: Booking Request ==================== -->
  <circle cx="500" cy="355" r="26" fill="#e0e7ff" stroke="#4338ca" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="363" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3730a3" text-anchor="middle">1</text>
  
  <line x1="280" y1="355" x2="466" y2="355" stroke="#4338ca" stroke-width="3"/>
  <polygon points="466,355 454,348 454,362" fill="#4338ca"/>
  
  <rect x="30" y="318" width="240" height="74" rx="8" fill="white" filter="url(#shadow)" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">BOOKING REQUEST</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">Cobalt &#8594; Forwarder</text>
  <text x="150" y="383" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Brand, PO#, CRD, route</text>
  
  <!-- ==================== STEP 2: SO ==================== -->
  <circle cx="500" cy="455" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="463" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9d174d" text-anchor="middle">2</text>
  
  <line x1="720" y1="455" x2="534" y2="455" stroke="#db2777" stroke-width="3"/>
  <polygon points="534,455 546,448 546,462" fill="#db2777"/>
  
  <rect x="730" y="418" width="240" height="74" rx="8" fill="white" filter="url(#shadow)" stroke="#db2777" stroke-width="2"/>
  <text x="850" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">SHIPPING ORDER (SO)</text>
  <text x="850" y="465" font-family="Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle">Forwarder &#8594; Cobalt</text>
  <text x="850" y="483" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Warehouse address, CFS cut-off</text>
  
  <!-- ==================== STEP 3: Draft B/L ==================== -->
  <circle cx="500" cy="545" r="26" fill="#f5d0fe" stroke="#a21caf" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="553" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#701a75" text-anchor="middle">3</text>
  
  <line x1="720" y1="545" x2="534" y2="545" stroke="#a21caf" stroke-width="3"/>
  <polygon points="534,545 546,538 546,552" fill="#a21caf"/>
  
  <rect x="730" y="508" width="240" height="74" rx="8" fill="white" filter="url(#shadow)" stroke="#a21caf" stroke-width="2"/>
  <text x="850" y="535" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">DRAFT B/L</text>
  <text x="850" y="555" font-family="Arial, sans-serif" font-size="11" fill="#a21caf" text-anchor="middle">Forwarder &#8594; Cobalt</text>
  <text x="850" y="573" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">HBL# for review, cargo at warehouse</text>
  
  <!-- ==================== STEP 4: Final B/L ==================== -->
  <circle cx="500" cy="635" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="643" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#155e75" text-anchor="middle">4</text>
  
  <line x1="720" y1="635" x2="534" y2="635" stroke="#0891b2" stroke-width="3"/>
  <polygon points="534,635 546,628 546,642" fill="#0891b2"/>
  
  <rect x="730" y="598" width="240" height="74" rx="8" fill="white" filter="url(#shadow)" stroke="#0891b2" stroke-width="2"/>
  <text x="850" y="625" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">FINAL B/L + INVOICE</text>
  <text x="850" y="645" font-family="Arial, sans-serif" font-size="11" fill="#0891b2" text-anchor="middle">Forwarder &#8594; Cobalt</text>
  <text x="850" y="663" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Vessel, ETD, ETA, freight cost</text>
  
  <!-- ==================== STEP 5: Telex Release ==================== -->
  <circle cx="500" cy="725" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="733" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">5</text>
  
  <line x1="720" y1="725" x2="534" y2="725" stroke="#16a34a" stroke-width="3"/>
  <polygon points="534,725 546,718 546,732" fill="#16a34a"/>
  
  <rect x="730" y="688" width="240" height="74" rx="8" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="2"/>
  <text x="850" y="715" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">TELEX RELEASE</text>
  <text x="850" y="735" font-family="Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">Forwarder &#8594; Cobalt</text>
  <text x="850" y="753" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Electronic release, goods collectible</text>
  
  <!-- ==================== KEY DATES BOX (Left side) ==================== -->
  <rect x="30" y="420" width="240" height="210" rx="8" fill="white" filter="url(#shadow)" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="420" width="240" height="30" rx="8" fill="#fef3c7"/>
  <rect x="30" y="442" width="240" height="8" fill="#fef3c7"/>
  <text x="150" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">KEY DATES &amp; TERMS</text>
  
  <text x="45" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">CRD (Cargo Ready Date)</text>
  <text x="45" y="490" font-family="Arial, sans-serif" font-size="10" fill="#666">When goods ready at Cobalt factory</text>
  
  <text x="45" y="513" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">CFS Cut-off</text>
  <text x="45" y="528" font-family="Arial, sans-serif" font-size="10" fill="#666">Deadline to deliver to warehouse</text>
  
  <text x="45" y="551" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">ETD (Estimated Departure)</text>
  <text x="45" y="566" font-family="Arial, sans-serif" font-size="10" fill="#666">When vessel leaves origin port</text>
  
  <text x="45" y="589" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">ETA (Estimated Arrival)</text>
  <text x="45" y="604" font-family="Arial, sans-serif" font-size="10" fill="#666">When vessel arrives at destination</text>
  
  <rect x="45" y="615" width="210" height="2" fill="#f59e0b"/>
  <text x="150" y="627" font-family="Arial, sans-serif" font-size="9" fill="#92400e" font-weight="bold" text-anchor="middle">Only CRD comes from Cobalt.</text>
  
  <!-- ==================== EXAMPLE BOX (Left side) ==================== -->
  <rect x="30" y="650" width="240" height="130" rx="8" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="650" width="240" height="30" rx="8" fill="#dcfce7"/>
  <rect x="30" y="672" width="240" height="8" fill="#dcfce7"/>
  <text x="150" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">EXAMPLE: New Lobster UK</text>
  
  <text x="45" y="700" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Jan 23: Booking sent (CRD Feb 3)</text>
  <text x="45" y="715" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Jan 30: SO received (cut-off Feb 3 noon)</text>
  <text x="45" y="730" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Feb 3: Draft B/L (cargo at warehouse)</text>
  <text x="45" y="745" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Feb 24: Final B/L (ETD Feb 22, ETA Mar 27)</text>
  <text x="45" y="760" font-family="Arial, sans-serif" font-size="9" fill="#1a1a2e">Mar 5: Telex Release</text>
  
  <text x="150" y="776" font-family="Arial, sans-serif" font-size="10" fill="#166534" font-weight="bold" text-anchor="middle">Total: 41 days</text>
  
  <!-- Footer -->
  <text x="500" y="870" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">ShipTrack POC | Cobalt Knitwear | C&amp;R Holdings | April 2026</text>
</svg>