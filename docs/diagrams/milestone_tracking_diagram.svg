<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750">
  <defs>
    <style>
      .title { font: bold 24px Arial, sans-serif; fill: white; }
      .subtitle { font: 14px Arial, sans-serif; fill: #aaa; }
      .state-label { font: bold 13px Arial, sans-serif; fill: white; }
      .state-desc { font: 11px Arial, sans-serif; fill: white; opacity: 0.9; }
      .arrow-label { font: bold 10px Arial, sans-serif; fill: #0066cc; }
      .section-title { font: bold 15px Arial, sans-serif; fill: #1a1a2e; }
      .alert-text { font: 11px Arial, sans-serif; fill: #333; }
      .time-text { font: 10px Arial, sans-serif; fill: #666; }
      .source-label { font: bold 12px Arial, sans-serif; }
      .source-text { font: 11px Arial, sans-serif; fill: #333; }
      .legend-text { font: 11px Arial, sans-serif; fill: #333; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="750" fill="#f5f5f5"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1400" height="60" fill="url(#headerGrad)"/>
  <text x="30" y="40" class="title">ShipTrack: Milestone Tracking Model</text>
  <text x="1370" y="40" text-anchor="end" class="subtitle">Cobalt Knitwear POC</text>

  <!-- ==================== SECTION 1: STATE FLOW ==================== -->
  <text x="30" y="95" class="section-title">Shipment State Flow</text>
  
  <!-- State boxes - much wider spacing -->
  
  <!-- BOOKED -->
  <rect x="30" y="115" width="160" height="60" rx="8" fill="#e6a23c"/>
  <circle cx="55" cy="138" r="10" fill="#ffd666"/>
  <text x="120" y="142" text-anchor="middle" class="state-label">BOOKED</text>
  <text x="120" y="160" text-anchor="middle" class="state-desc">Waiting for SO</text>
  
  <!-- Arrow 1 -->
  <line x1="190" y1="145" x2="250" y2="145" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="132" text-anchor="middle" class="arrow-label">SO</text>
  
  <!-- CONFIRMED -->
  <rect x="255" y="115" width="160" height="60" rx="8" fill="#67c23a"/>
  <circle cx="280" cy="138" r="10" fill="#95d475"/>
  <text x="345" y="142" text-anchor="middle" class="state-label">CONFIRMED</text>
  <text x="345" y="160" text-anchor="middle" class="state-desc">Waiting for cargo</text>
  
  <!-- Arrow 2 -->
  <line x1="415" y1="145" x2="475" y2="145" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="445" y="132" text-anchor="middle" class="arrow-label">Draft B/L</text>
  
  <!-- AT WAREHOUSE -->
  <rect x="480" y="115" width="180" height="60" rx="8" fill="#409eff"/>
  <circle cx="505" cy="138" r="10" fill="#79bbff"/>
  <text x="580" y="142" text-anchor="middle" class="state-label">AT WAREHOUSE</text>
  <text x="580" y="160" text-anchor="middle" class="state-desc">Waiting to sail</text>
  
  <!-- Arrow 3 -->
  <line x1="660" y1="145" x2="720" y2="145" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="690" y="132" text-anchor="middle" class="arrow-label">Final B/L</text>
  
  <!-- SAILED -->
  <rect x="725" y="115" width="160" height="60" rx="8" fill="#9b59b6"/>
  <circle cx="750" cy="138" r="10" fill="#c39bd3"/>
  <text x="815" y="142" text-anchor="middle" class="state-label">SAILED</text>
  <text x="815" y="160" text-anchor="middle" class="state-desc">Waiting for telex</text>
  
  <!-- Arrow 4 -->
  <line x1="885" y1="145" x2="945" y2="145" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="915" y="132" text-anchor="middle" class="arrow-label">Telex</text>
  
  <!-- RELEASED -->
  <rect x="950" y="115" width="160" height="60" rx="8" fill="#909399"/>
  <circle cx="975" cy="138" r="10" fill="#c0c4cc"/>
  <text x="1040" y="142" text-anchor="middle" class="state-label">RELEASED</text>
  <text x="1040" y="160" text-anchor="middle" class="state-desc">Can be collected</text>
  
  <!-- Arrow 5 -->
  <line x1="1110" y1="145" x2="1170" y2="145" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- DELIVERED -->
  <rect x="1175" y="115" width="180" height="60" rx="8" fill="#27ae60"/>
  <circle cx="1200" cy="138" r="10" fill="#58d68d"/>
  <text x="1275" y="142" text-anchor="middle" class="state-label">DELIVERED</text>
  <text x="1275" y="160" text-anchor="middle" class="state-desc">Complete</text>

  <!-- ==================== SECTION 2: ALERT RULES ==================== -->
  <line x1="30" y1="200" x2="1370" y2="200" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="230" class="section-title">Alert Triggers (by State)</text>
  
  <!-- Alert connectors (dashed lines from states to alerts) -->
  <line x1="110" y1="175" x2="110" y2="255" stroke="#e6a23c" stroke-width="2" stroke-dasharray="5"/>
  <line x1="335" y1="175" x2="335" y2="255" stroke="#67c23a" stroke-width="2" stroke-dasharray="5"/>
  <line x1="570" y1="175" x2="570" y2="255" stroke="#409eff" stroke-width="2" stroke-dasharray="5"/>
  <line x1="805" y1="175" x2="805" y2="255" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5"/>
  <line x1="1030" y1="175" x2="1030" y2="255" stroke="#909399" stroke-width="2" stroke-dasharray="5"/>
  
  <!-- Alert 1: BOOKED - Warning -->
  <rect x="30" y="255" width="160" height="85" rx="6" fill="#fef0c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="38" y="263" width="65" height="20" rx="4" fill="#f59e0b"/>
  <text x="70" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">WARNING</text>
  <text x="110" y="302" text-anchor="middle" class="alert-text">No SO received</text>
  <text x="110" y="318" text-anchor="middle" class="alert-text">in 2 days</text>
  <text x="110" y="336" text-anchor="middle" class="time-text">Threshold: 2 days</text>
  
  <!-- Alert 2a: CONFIRMED - Warning -->
  <rect x="210" y="255" width="165" height="85" rx="6" fill="#fef0c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="218" y="263" width="65" height="20" rx="4" fill="#f59e0b"/>
  <text x="250" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">WARNING</text>
  <text x="292" y="302" text-anchor="middle" class="alert-text">Cut-off tomorrow,</text>
  <text x="292" y="318" text-anchor="middle" class="alert-text">no Draft B/L yet</text>
  <text x="292" y="336" text-anchor="middle" class="time-text">Threshold: 1 day before</text>
  
  <!-- Alert 2b: CONFIRMED - Critical -->
  <rect x="385" y="255" width="165" height="85" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="393" y="263" width="60" height="20" rx="4" fill="#ef4444"/>
  <text x="423" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">CRITICAL</text>
  <text x="467" y="302" text-anchor="middle" class="alert-text">Cut-off passed,</text>
  <text x="467" y="318" text-anchor="middle" class="alert-text">no Draft B/L</text>
  <text x="467" y="336" text-anchor="middle" class="time-text">Immediate alert</text>
  
  <!-- Alert 3: AT WAREHOUSE - Warning -->
  <rect x="560" y="255" width="175" height="85" rx="6" fill="#fef0c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="568" y="263" width="65" height="20" rx="4" fill="#f59e0b"/>
  <text x="600" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">WARNING</text>
  <text x="647" y="302" text-anchor="middle" class="alert-text">5+ days since Draft B/L,</text>
  <text x="647" y="318" text-anchor="middle" class="alert-text">no Final B/L received</text>
  <text x="647" y="336" text-anchor="middle" class="time-text">Threshold: 5 days</text>
  
  <!-- Alert 4: SAILED - Info -->
  <rect x="745" y="255" width="175" height="85" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="753" y="263" width="40" height="20" rx="4" fill="#3b82f6"/>
  <text x="773" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">INFO</text>
  <text x="832" y="302" text-anchor="middle" class="alert-text">7+ days since Final B/L,</text>
  <text x="832" y="318" text-anchor="middle" class="alert-text">no Telex release</text>
  <text x="832" y="336" text-anchor="middle" class="time-text">Threshold: 7 days</text>
  
  <!-- Alert 5: RELEASED - Info -->
  <rect x="930" y="255" width="175" height="85" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="938" y="263" width="40" height="20" rx="4" fill="#3b82f6"/>
  <text x="958" y="278" text-anchor="middle" style="font: bold 10px Arial; fill: white;">INFO</text>
  <text x="1017" y="302" text-anchor="middle" class="alert-text">ETA + 3 days passed,</text>
  <text x="1017" y="318" text-anchor="middle" class="alert-text">no delivery confirmation</text>
  <text x="1017" y="336" text-anchor="middle" class="time-text">Threshold: 3 days</text>
  
  <!-- Key Insight box (right side) -->
  <rect x="1125" y="255" width="230" height="85" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="1240" y="280" text-anchor="middle" class="source-label" fill="#7c3aed">KEY INSIGHT</text>
  <text x="1240" y="302" text-anchor="middle" class="source-text">Alerts are based on</text>
  <text x="1240" y="320" text-anchor="middle" style="font: bold 12px Arial; fill: #7c3aed;">"time since last milestone"</text>
  <text x="1240" y="336" text-anchor="middle" class="time-text">not "time until deadline"</text>

  <!-- ==================== SECTION 3: DATA SOURCES ==================== -->
  <line x1="30" y1="365" x2="1370" y2="365" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="400" class="section-title">Date Sources: Who Provides What</text>
  
  <!-- Cobalt provides -->
  <rect x="30" y="420" width="220" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="448" text-anchor="middle" class="source-label" fill="#0369a1">COBALT PROVIDES</text>
  <text x="140" y="478" text-anchor="middle" style="font: bold 18px Arial; fill: #0284c7;">CRD</text>
  <text x="140" y="498" text-anchor="middle" class="source-text">(Cargo Ready Date)</text>
  
  <!-- Arrow to Forwarder -->
  <line x1="250" y1="465" x2="310" y2="465" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="452" text-anchor="middle" class="arrow-label">Step 1</text>
  
  <!-- Forwarder provides -->
  <rect x="315" y="420" width="700" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="665" y="448" text-anchor="middle" class="source-label" fill="#b45309">FORWARDER PROVIDES (via emails)</text>
  
  <!-- Individual date boxes inside forwarder area -->
  <rect x="335" y="460" width="130" height="42" rx="5" fill="#fde68a"/>
  <text x="400" y="480" text-anchor="middle" style="font: bold 12px Arial; fill: #92400e;">CFS Cut-off</text>
  <text x="400" y="496" text-anchor="middle" class="time-text">(Step 2: SO)</text>
  
  <rect x="480" y="460" width="100" height="42" rx="5" fill="#fde68a"/>
  <text x="530" y="480" text-anchor="middle" style="font: bold 12px Arial; fill: #92400e;">ETD</text>
  <text x="530" y="496" text-anchor="middle" class="time-text">(Step 4: Final B/L)</text>
  
  <rect x="595" y="460" width="100" height="42" rx="5" fill="#fde68a"/>
  <text x="645" y="480" text-anchor="middle" style="font: bold 12px Arial; fill: #92400e;">ETA</text>
  <text x="645" y="496" text-anchor="middle" class="time-text">(Step 4: Final B/L)</text>
  
  <rect x="710" y="460" width="130" height="42" rx="5" fill="#fde68a"/>
  <text x="775" y="480" text-anchor="middle" style="font: bold 12px Arial; fill: #92400e;">Release Date</text>
  <text x="775" y="496" text-anchor="middle" class="time-text">(Step 5: Telex)</text>
  
  <rect x="855" y="460" width="145" height="42" rx="5" fill="#fde68a"/>
  <text x="927" y="480" text-anchor="middle" style="font: bold 12px Arial; fill: #92400e;">Vessel + Voyage</text>
  <text x="927" y="496" text-anchor="middle" class="time-text">(Step 4: Final B/L)</text>

  <!-- Implication box -->
  <rect x="1035" y="420" width="320" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1195" y="448" text-anchor="middle" class="source-label" fill="#dc2626">WHY THIS MATTERS</text>
  <text x="1195" y="472" text-anchor="middle" class="source-text">Cobalt cannot predict delays upfront.</text>
  <text x="1195" y="490" text-anchor="middle" class="source-text">ShipTrack alerts when expected emails</text>
  <text x="1195" y="506" text-anchor="middle" style="font: bold 11px Arial; fill: #dc2626;">don't arrive on time.</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="535" width="1325" height="55" rx="8" fill="white" stroke="#ddd"/>
  <text x="55" y="568" style="font: bold 12px Arial; fill: #333;">Legend:</text>
  
  <!-- Critical -->
  <rect x="130" y="550" width="22" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="566" class="legend-text">CRITICAL - Deadline passed, action needed</text>
  
  <!-- Warning -->
  <rect x="400" y="550" width="22" height="22" rx="4" fill="#fef0c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="566" class="legend-text">WARNING - Deadline approaching</text>
  
  <!-- Info -->
  <rect x="640" y="550" width="22" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="566" class="legend-text">INFO - Status check recommended</text>
  
  <!-- Dashed line -->
  <line x1="880" y1="561" x2="930" y2="561" stroke="#666" stroke-width="2" stroke-dasharray="5"/>
  <text x="945" y="566" class="legend-text">Dashed line connects state to its alert rules</text>

  <!-- ==================== CONFIGURABLE THRESHOLDS TABLE ==================== -->
  <text x="30" y="620" class="section-title">Configurable Alert Thresholds</text>
  
  <!-- Table header -->
  <rect x="30" y="630" width="1325" height="30" rx="0" fill="#e5e7eb"/>
  <text x="100" y="650" text-anchor="middle" style="font: bold 11px Arial; fill: #374151;">Rule</text>
  <text x="250" y="650" text-anchor="middle" style="font: bold 11px Arial; fill: #374151;">State</text>
  <text x="550" y="650" text-anchor="middle" style="font: bold 11px Arial; fill: #374151;">Condition</text>
  <text x="900" y="650" text-anchor="middle" style="font: bold 11px Arial; fill: #374151;">Default Threshold</text>
  <text x="1150" y="650" text-anchor="middle" style="font: bold 11px Arial; fill: #374151;">Severity</text>
  
  <!-- Table rows -->
  <rect x="30" y="660" width="1325" height="25" fill="white" stroke="#e5e7eb"/>
  <text x="100" y="677" text-anchor="middle" style="font: 10px Arial; fill: #333;">A1</text>
  <text x="250" y="677" text-anchor="middle" style="font: 10px Arial; fill: #333;">BOOKED</text>
  <text x="550" y="677" text-anchor="middle" style="font: 10px Arial; fill: #333;">Days since booking request sent, no SO received</text>
  <text x="900" y="677" text-anchor="middle" style="font: 10px Arial; fill: #333;">2 days</text>
  <rect x="1100" y="665" width="65" height="16" rx="3" fill="#f59e0b"/>
  <text x="1132" y="677" text-anchor="middle" style="font: bold 9px Arial; fill: white;">WARNING</text>
  
  <rect x="30" y="685" width="1325" height="25" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="100" y="702" text-anchor="middle" style="font: 10px Arial; fill: #333;">A2</text>
  <text x="250" y="702" text-anchor="middle" style="font: 10px Arial; fill: #333;">CONFIRMED</text>
  <text x="550" y="702" text-anchor="middle" style="font: 10px Arial; fill: #333;">Cut-off date approaching, no Draft B/L received</text>
  <text x="900" y="702" text-anchor="middle" style="font: 10px Arial; fill: #333;">1 day before cut-off</text>
  <rect x="1100" y="690" width="65" height="16" rx="3" fill="#f59e0b"/>
  <text x="1132" y="702" text-anchor="middle" style="font: bold 9px Arial; fill: white;">WARNING</text>
  
  <rect x="30" y="710" width="1325" height="25" fill="white" stroke="#e5e7eb"/>
  <text x="100" y="727" text-anchor="middle" style="font: 10px Arial; fill: #333;">A3</text>
  <text x="250" y="727" text-anchor="middle" style="font: 10px Arial; fill: #333;">CONFIRMED</text>
  <text x="550" y="727" text-anchor="middle" style="font: 10px Arial; fill: #333;">Cut-off date passed, no Draft B/L received</text>
  <text x="900" y="727" text-anchor="middle" style="font: 10px Arial; fill: #333;">0 days (immediate)</text>
  <rect x="1100" y="715" width="60" height="16" rx="3" fill="#ef4444"/>
  <text x="1130" y="727" text-anchor="middle" style="font: bold 9px Arial; fill: white;">CRITICAL</text>

  <!-- Footer -->
  <text x="700" y="750" text-anchor="middle" style="font: italic 10px Arial; fill: #999;">All thresholds are configurable during POC setup. Confirm defaults with Cobalt operations team.</text>
</svg>