name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels its still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Backend integration tests hit Postgres; backend/test/setup-db.ts creates + migrates
    # `cobalt_test` on this server on first connect (fresh DB → all drizzle migrations run).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cobalt_test
      # >= 32 chars so env-validated boot paths pass. CI-only, not a real secret.
      JWT_SECRET: ci-not-a-real-secret-please-rotate-0123456789

    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so the pnpm store can be cached.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # One clean workspace install from the lockfile — the correct install (NOT `pnpm -C <pkg>`,
      # which nests a divergent drizzle-orm and breaks the backend typecheck).
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Backend — typecheck
        run: pnpm --filter backend exec tsc --noEmit -p tsconfig.json

      - name: Backend — tests
        run: pnpm --filter backend run test

      - name: Frontend — typecheck
        run: pnpm --filter frontend exec tsc --noEmit

      # Includes the `no-db-access` guardrail spec (frontend holds no DB driver / secret).
      - name: Frontend — tests
        run: pnpm --filter frontend run test

      - name: Build (frontend + backend)
        run: pnpm build

  # SQL Server (Fabric SQL target) — informational during the Phase 1+2 port; becomes required
  # when all repos are ported. Runs the foundation + ported-repo specs against mssql-2022.
  build-and-test-sqlserver:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "grep -q 'SQL Server is now ready' /var/opt/mssql/log/errorlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FABRIC_FOUNDATION: '1'
      SQL_SERVER_TEST_URL: 'Server=localhost,1433;Database=cobalt_test;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=false;TrustServerCertificate=true'
      JWT_SECRET: ci-not-a-real-secret-please-rotate-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Create cobalt_test database
        run: pnpm --filter backend exec node -e "const t=require('tedious');const c=new t.Connection({server:'localhost',authentication:{type:'default',options:{userName:'sa',password:process.env.MSSQL_SA_PASSWORD}},options:{port:1433,trustServerCertificate:true,encrypt:false}});c.on('connect',e=>{if(e){console.error(e);process.exit(1)}c.execSql(new t.Request('CREATE DATABASE cobalt_test',r=>{if(r)console.log('db exists or created');c.close();process.exit(0)}))});c.connect()"
        env:
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
      - name: Backend — typecheck
        run: pnpm --filter backend exec tsc --noEmit -p tsconfig.json
      - name: Backend — foundation + SQL Server specs
        # Only the SQL Server-gated specs (foundation + ported repos). The full Postgres suite runs
        # in the build-and-test job. These specs skip when FABRIC_FOUNDATION is unset; here it IS set.
        run: pnpm --filter backend exec vitest run test/foundation.int.spec.ts test/masters.kysely.int.spec.ts test/leaf-repos.kysely.int.spec.ts test/ingest.kysely.int.spec.ts test/evidence.kysely.int.spec.ts test/purchase-order.kysely.int.spec.ts
