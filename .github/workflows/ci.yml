name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels its still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Backend integration tests hit SQL Server (the Fabric SQL dev/CI engine);
    # backend/test/setup-db.ts creates + migrates `cobalt_test` on first connect
    # (kysely's own migration ledger makes re-runs incremental).
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "grep -q 'SQL Server is now ready' /var/opt/mssql/log/errorlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SQL_SERVER_TEST_URL: 'Server=localhost,1433;Database=cobalt_test;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=false;TrustServerCertificate=true'
      # >= 32 chars so env-validated boot paths pass. CI-only, not a real secret.
      JWT_SECRET: ci-not-a-real-secret-please-rotate-0123456789

    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so the pnpm store can be cached.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # One clean workspace install from the lockfile — the correct install (NOT `pnpm -C <pkg>`,
      # which nests divergent deps and breaks the backend typecheck).
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Backend — typecheck
        run: pnpm --filter backend exec tsc --noEmit -p tsconfig.json

      # Full suite (unit + integration + data-layer SQL Server specs) against the mssql service.
      - name: Backend — tests
        run: pnpm --filter backend run test

      - name: Frontend — typecheck
        run: pnpm --filter frontend exec tsc --noEmit

      # Includes the `no-db-access` guardrail spec (frontend holds no DB driver / secret).
      - name: Frontend — tests
        run: pnpm --filter frontend run test

      - name: Build (frontend + backend)
        run: pnpm build
