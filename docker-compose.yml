# ShipTrack — self-contained stack: SQL Server + the app image (backend serves API + SPA on :3000).
#   docker compose up --build       # build the image + run everything
#   open http://localhost:3000       # login admin@cobalt.hk / cobalt
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd' # dev/demo only — rotate for anything shared
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - shiptrack_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: shiptrack:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # migrate-cli creates the `cobalt` database on first boot if it doesn't exist.
      SQL_SERVER_URL: "Server=db,1433;Database=cobalt;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=false;TrustServerCertificate=true"
      PORT: "3000"
      STATIC_ROOT: /app/frontend/dist
      # Demo secret only — set a real 32+ char JWT_SECRET in production.
      JWT_SECRET: "cobalt-demo-jwt-secret-change-in-production-0123456789"
      # first boot: create the schema + load demo data. Set both to "0" after the volume is seeded.
      RUN_MIGRATIONS: "1"
      SEED_ON_START: "1"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  shiptrack_mssqldata:
